trigger:
  branches:
    include:
      - main

variables:
  JAVA_VERSION: '17'
  JDK_VERSION: '1.17'
  azureSubscription: 'MyAzureSubscription'
  artifactName: 'app'
  TEST_RUN_TITLE: 'Testes de CRUD'

stages:

- stage: Infraestrutura
  displayName: 'Criar infraestrutura'
  jobs:
    - job: CriarInfra
      displayName: 'Provisionar Banco e recursos Azure'
      pool:
        vmImage: 'ubuntu-latest'

      steps:
        - checkout: self

        - task: AzureCLI@2
          displayName: 'Banco e Azure'
          inputs:
            azureSubscription: '$(azureSubscription)'
            scriptType: 'bash'
            scriptLocation: 'scriptPath'
            scriptPath: 'scripts/infra-app.sh'
            arguments: '"$(ORACLE_HOST)" "$(ORACLE_PORT)" "$(ORACLE_SID)" "$(ORACLE_USER)" "$(ORACLE_PASS)"'
            workingDirectory: '$(Build.SourcesDirectory)'
            failOnStandardError: false

- stage: CI
  displayName: 'CI - Build e Testes'
  dependsOn: Infraestrutura
  condition: succeeded()

  jobs:
    - job: BuildTest
      displayName: 'Build and Test'
      pool:
        vmImage: 'ubuntu-latest'

      steps:
        - checkout: self

        - task: JavaToolInstaller@0
          displayName: 'Configurar Java 17'
          inputs:
            versionSpec: $(JAVA_VERSION)
            jdkArchitectureOption: 'x64'
            jdkSourceOption: 'PreInstalled'

        - task: Maven@4
          displayName: 'Maven - Compilar e executar testes'
          inputs:
            mavenPomFile: 'pom.xml'
            goals: 'clean package'
            options: ''
            publishJUnitResults: true
            testResultsFiles: '**/surefire-reports/TEST-*.xml'
            testRunTitle: $(TEST_RUN_TITLE)
            javaHomeOption: 'JDKVersion'
            jdkVersionOption: $(JDK_VERSION)
            mavenVersionOption: 'Default'

        - task: CopyFiles@2
          displayName: 'Preparar artefato JAR'
          inputs:
            SourceFolder: '$(System.DefaultWorkingDirectory)'
            Contents: '**/target/*.jar'
            TargetFolder: '$(Build.ArtifactStagingDirectory)/$(artifactName)'

        - task: PublishPipelineArtifact@1
          displayName: 'Publicar artefato app'
          inputs:
            targetPath: '$(Build.ArtifactStagingDirectory)/$(artifactName)'
            artifact: '$(artifactName)'
            publishLocation: 'pipeline'

- stage: CD
  displayName: 'CD - Deploy no Azure Web App'
  dependsOn: CI
  condition: succeeded()

  jobs:
    - job: DeployWebApp
      displayName: 'Deploy no Serviço de Aplicativo'
      pool:
        vmImage: 'ubuntu-latest'

      steps:
        - checkout: none

        - task: DownloadPipelineArtifact@2
          displayName: 'Baixar artefato'
          inputs:
            buildType: 'current'
            artifactName: '$(artifactName)'
            targetPath: '$(Pipeline.Workspace)/$(artifactName)'

        - task: AzureAppServiceSettings@1
          displayName: 'Configurar variáveis de ambiente do Web App'
          inputs:
            azureSubscription: '$(azureSubscription)'
            appName: '$(NOME_WEBAPP)'
            appSettings: |
              [
                {
                  "name": "SPRING_DATASOURCE_URL",
                  "value": "jdbc:oracle:thin:@//$(ORACLE_HOST):$(ORACLE_PORT)/$(ORACLE_SID)",
                  "slotSetting": false
                },
                {
                  "name": "SPRING_DATASOURCE_USERNAME",
                  "value": "$(ORACLE_USER)",
                  "slotSetting": false
                },
                {
                  "name": "SPRING_DATASOURCE_PASSWORD",
                  "value": "$(ORACLE_PASS)",
                  "slotSetting": false
                }
              ]

        - task: AzureWebApp@1
          displayName: 'Deploy via Zip Deploy'
          inputs:
            azureSubscription: '$(azureSubscription)'
            appType: 'webAppLinux'
            appName: '$(NOME_WEBAPP)'
            package: '$(Pipeline.Workspace)/$(artifactName)/**/*.jar'
            deploymentMethod: 'zipDeploy'
